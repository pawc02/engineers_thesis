{% load static %}
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuń użytkownika</title>
    <link rel="stylesheet" href="{% static 'eccApp/style.css' %}">
</head>
<body>
<h1>Usuń użytkownika</h1>
<p>Czy na pewno chcesz usunąć użytkownika <strong>{{ key.username }}</strong>? Aby potwierdzić, wprowadź hasło:</p>

{% if messages %}
    <div class="messages">
        {% for message in messages %}
            <p class="{{ message.tags }}">{{ message }}</p>
        {% endfor %}
    </div>
{% endif %}
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Usuń użytkownika</button>
</form>

<a href="{% url 'users' %}"><button>Wstecz</button></a>
</body>
</html>
