{% load static %}
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zaszyfrowane wiadomości</title>
    <link rel="stylesheet" href="{% static 'eccApp/style.css' %}">
</head>
<body>
<h1>Zaszyfrowane wiadomości</h1>
<ul>
    {% for message in messages %}
        <li>
            <a href="{% url 'elgamal_message_detail' message.id %}">
                Odbiorca: {{ message.receiver }} - {{ message.timestamp }}
            </a>
        </li>
    {% endfor %}
</ul>
<a href="{% url 'elgamal_page' %}"><button>Wstecz</button></a>
</body>
</html>
