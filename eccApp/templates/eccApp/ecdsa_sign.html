{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Message</title>
    <link rel="stylesheet" href="{% static 'eccApp/style.css' %}">
</head>
<body>

<h1>Sign message</h1>
<!-- Wyświetlanie komunikatów o błędach -->
{% if messages %}
    <div>
        {% for message in messages %}
            <p class="message {{ message.tags }}">{{ message }}</p>
        {% endfor %}
    </div>
{% endif %}
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Sign</button>
</form>
<a href="{% url 'ecdsa_page' %}"><button>Go back</button></a>

</body>
</html>
